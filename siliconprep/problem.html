</head>
<body>

<nav class="nav">
  <div class="container">
    <a href="index.html" class="brand">
      <svg class="brand-mark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 15h3v-6h3v9h3v-12h3v9h3v-6h4"/></svg>

    <div class="nav-links">

      <a href="index.html#tracks">Tracks</a>
      <a href="index.html#practice">Topics</a>
    </div>
    <div class="nav-actions">
      <a href="#" class="btn btn-ghost btn-sm">Sign in</a>
      <a href="problems.html" class="btn btn-primary btn-sm">Get started</a>
    </div>
    <button class="nav-menu-btn" aria-label="Toggle menu" aria-expanded="false">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
    </button>
  </div>
</nav>

<div class="container">
  <a href="problems.html" class="back-link">&larr; All problems</a>

  <div class="problem-shell">
    <div class="panel">
      <div class="problem-meta">
        <span class="pip" id="problem-pip"></span>
        <span style="font-family:var(--font-mono); font-size:12px; color:var(--text-muted)" id="problem-eyebrow"></span>
      </div>
      <h1 id="problem-title">Loading…</h1>
      <div class="problem-tags" id="problem-tags"></div>

      <p id="problem-description" style="white-space:pre-wrap"></p>

      <h3>Constraints</h3>
      <p id="problem-constraints" style="white-space:pre-wrap"></p>
    </div>

    <div class="panel editor-panel">
      <div class="editor-toolbar">
        <div class="lang-tabs">
          <button class="lang-tab active" data-lang="verilog">Verilog</button>
          <button class="lang-tab" data-lang="sv">SystemVerilog</button>
          <button class="lang-tab" data-lang="vhdl">VHDL</button>
        </div>
        <div class="btn-group">
          <button class="btn btn-ghost btn-sm" id="run-btn">Run</button>
          <button class="btn btn-primary btn-sm" id="submit-btn">Submit</button>
        </div>
      </div>

      <textarea id="code-editor"></textarea>

      <div class="console-panel">
        <div class="console-head">
          <span>Console</span>
          <span class="status-badge" id="run-status">Not run yet</span>
        </div>
        <div class="console-body" id="console-body"><span class="muted">Click Run to compile and simulate against the hidden testbench.</span></div>
      </div>
    </div>
  </div>
</div>

<footer class="site-footer">
  <div class="container">
    <p>SiliconPrep — a starter template. Rename it, brand it, make it yours.</p>
    <div class="footer-links">

      <a href="#">GitHub</a>
    </div>
  </div>
</footer>
